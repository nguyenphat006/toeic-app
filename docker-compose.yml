services:
  web:
    image: node:20-alpine
    container_name: toeic_web
    working_dir: /app
    # Reinstall only when the lockfile changes, so restarts stay fast.
    command: >
      sh -c "if ! cmp -s package-lock.json node_modules/.lock; then npm ci --no-audit --no-fund && cp package-lock.json node_modules/.lock; fi;
             npm run dev"
    ports:
      - "3100:3100"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # File events do not cross the Windows -> Docker bind mount reliably; poll instead.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
